name: Build, test & deploy yourcarguy806.com

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build and test tools
        run: |
          pip install -r requirements-ci.txt
          npm ci --no-audit --no-fund
      - name: Build site (English + Spanish)
        run: python3 build.py
      - name: Static checks (links, phones, SEO, hreflang, sitemap)
        run: python3 tests/static_checks.py
      - name: HTML validation
        run: npx --no-install html-validate $(find dist -name '*.html')
      - name: Deploy script and redirect middleware tests
        run: |
          python3 -m unittest tests/test_cloudflare_setup.py
          node --test tests/middleware.test.mjs
      - name: Browser smoke tests (Chrome, phone + desktop)
        run: python3 tests/browser_checks.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.yourcarguy806.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secrets::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Make sure the Pages project exists
        run: python3 scripts/cloudflare_setup.py ensure-project
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.20.0 pages deploy dist --project-name yourcarguy806 --branch main --commit-dirty=true
      - name: Attach www.yourcarguy806.com and yourcarguy806.com
        run: python3 scripts/cloudflare_setup.py attach-domains
      - name: Verify the live site
        run: python3 scripts/cloudflare_setup.py verify
